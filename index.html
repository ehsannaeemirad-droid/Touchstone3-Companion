<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>سامانه هوشمند موجودی و تأمین</title>
<style>
:root{--bg:#eef2f6;--p:#fff;--p2:#f6f8fa;--tx:#17212b;--mu:#6b7785;--ln:#dfe5eb;--navy:#16324f;--blue:#2477b9;--red:#c53b3b;--org:#d9822b;--yel:#c79a16;--grn:#2d8a57;--gold:#8a6d1f}
*{box-sizing:border-box}
html{scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.6 Vazirmatn,Tahoma,"Segoe UI",sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
button,select,input{font:inherit;color:inherit}
small,.mu{color:var(--mu);font-size:11px}
.top{background:var(--navy);color:#fff;padding:10px 20px;padding-top:calc(10px + env(safe-area-inset-top,0px));position:sticky;top:0;z-index:30}
.topr{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;max-width:1500px;margin:auto}
.brand{display:flex;gap:12px;align-items:center}.brand>span{font-size:26px}h1{font-size:18px;margin:0}.brand small{color:#b9c9d8;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pill{font-size:10px;border-radius:20px;padding:2px 8px;font-weight:700;white-space:nowrap}
.pill.g{background:#d9f2e3;color:#1d6b40}.pill.o{background:#ffe6cc;color:#94510f}.pill.n{background:#dde5ec;color:#44515e}.pill.r{background:#fde9e9;color:#8f2525}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:flex;background:#0f2338;border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:none;color:#a9bccd;padding:6px 12px;border-radius:7px;cursor:pointer;font-size:12px;font-weight:600}
.seg button.on{background:#2c74b3;color:#fff}
.pbtn{border:1px solid #3a5872;background:#1c3a54;color:#e6edf3;border-radius:8px;padding:6px 12px;cursor:pointer;font-size:12px}
#nav{display:flex;gap:6px;padding:6px 0 0;overflow-x:auto;max-width:1500px;margin:auto;scrollbar-width:none}
#nav::-webkit-scrollbar{display:none}
#nav button{border:0;background:none;color:#d9e5ef;padding:8px 12px;border-radius:8px 8px 0 0;cursor:pointer;white-space:nowrap;flex:none}#nav button.on,#nav button:hover{background:var(--bg);color:var(--navy)}#nav i{font-style:normal;margin-left:5px}
.wrap{max-width:1500px;margin:auto;padding:16px 20px 40px}
.card{background:var(--p);border:1px solid var(--ln);border-radius:12px;box-shadow:0 4px 16px rgba(22,50,79,.07)}
.pn{padding:16px;margin-bottom:16px}.ph{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:12px;flex-wrap:wrap}.ph h2{font-size:16px;margin:0;display:flex;align-items:center;gap:6px}
.hint{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;background:#e4ebf1;color:#5b6a78;font-size:10px;cursor:help;flex:none}
#filters{margin-bottom:14px;padding:4px 14px}#filters summary{cursor:pointer;padding:8px 0;font-weight:700;list-style:none}
.fs{display:flex;gap:10px;flex-wrap:wrap;padding:4px 0 10px}.fs label{font-size:11px;color:var(--mu);display:flex;flex-direction:column;gap:2px}
select,input[type=text],input[type=number]{border:1px solid var(--ln);border-radius:7px;background:#fff;padding:6px 8px;min-width:120px;max-width:190px}
.lnk{background:#f0f4f7;border:1px solid var(--ln);border-radius:7px;padding:5px 12px;cursor:pointer;margin:8px 0 0}
.ban{border-radius:12px;padding:14px 18px;margin-bottom:14px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center;border:1px solid}
.ban.r{background:#fde9e9;border-color:#f1b9b9;color:#8f2525}.ban.o{background:#fff0df;border-color:#f0cfa2;color:#8a5010}.ban.g{background:#e5f5ec;border-color:#b5e0c6;color:#1d6b40}.ban span{font-size:12px}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px}
.kpi{padding:13px 15px;position:relative;overflow:hidden;cursor:pointer;text-align:right}.kpi:before{content:"";position:absolute;right:0;top:0;width:4px;height:100%;background:var(--blue)}
.kpi.red:before{background:var(--red)}.kpi.org:before{background:var(--org)}.kpi.grn:before{background:var(--grn)}.kpi.yel:before{background:var(--yel)}.kpi.gold:before{background:var(--gold)}
.kpi:hover{box-shadow:0 6px 20px rgba(22,50,79,.15)}.kpi .l{font-size:12px;color:var(--mu)}.kpi .v{font-size:24px;font-weight:700;margin-top:4px}.kpi .s{font-size:11px;color:var(--mu)}
.dl{font-style:normal;font-size:11px;margin-right:6px}.dl.r{color:var(--red)}.dl.g{color:var(--grn)}
.g2{display:grid;grid-template-columns:1.7fr 1fr;gap:16px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.g2e{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.tw{overflow:auto;max-height:460px}table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:right;background:#f4f7f9;color:#65717d;padding:8px;position:sticky;top:0;cursor:pointer;white-space:nowrap}td{padding:8px;border-bottom:1px solid #edf0f3;vertical-align:middle}tbody tr{cursor:pointer}tbody tr:hover{background:#f6fafd}
.tg{display:inline-block;font-size:10px;font-weight:700;border-radius:20px;padding:1px 8px;margin:2px 0 0 4px;white-space:nowrap}
.tg.r{background:#fde9e9;color:#a52f2f}.tg.o{background:#fff0df;color:#a65d13}.tg.y{background:#fff8d8;color:#8d7011}.tg.g{background:#e5f5ec;color:#237044}
.pb{height:6px;background:#edf1f4;border-radius:9px;overflow:hidden;width:70px;margin-bottom:2px}.pb i{display:block;height:100%}
.br{display:grid;grid-template-columns:120px 1fr 56px;gap:8px;align-items:center;margin:8px 0;font-size:11px}.br[onclick]{cursor:pointer}.br span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.br i{display:flex;height:12px;background:#edf1f4;border-radius:20px;overflow:hidden}.br b{display:block;height:100%}.br em{font-style:normal;font-weight:700;text-align:left}
.gg{position:relative;width:190px;margin:0 auto}.gv{position:absolute;top:34%;right:0;left:0;text-align:center;font-size:26px;font-weight:700;line-height:1.1}.gv small{display:block;font-weight:400}
.tl{position:absolute;top:0;left:-58px;display:flex;flex-direction:column;gap:4px;background:#2b3742;padding:6px;border-radius:14px}.tl i{width:14px;height:14px;border-radius:50%;display:block}
.wk{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.wt{background:var(--p2);border-radius:10px;padding:11px;cursor:pointer;border:1px solid var(--ln)}.wt:hover{border-color:var(--blue)}.wt strong{display:block;font-size:26px}.wt small{display:block;min-height:34px}
.ri{display:flex;gap:10px;align-items:center;padding:9px;background:var(--p2);border-radius:8px;margin-bottom:8px;cursor:pointer}.ri i{width:5px;height:34px;border-radius:5px;flex:none}.ri b{font-size:12px}.ri div{flex:1}.ri small{display:block}.ri em{font-style:normal;font-weight:700}
.mg{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}.mini{padding:11px;background:var(--p2);border-radius:9px}.mini strong{font-size:19px;display:block}.mini span{font-size:11px;color:var(--mu)}.mini.r strong{color:var(--red)}.mini.o strong{color:var(--org)}.mini.g strong{color:var(--grn)}
.em{padding:18px;text-align:center;color:var(--mu)}
.dr{position:fixed;inset:0;background:rgba(10,20,30,.45);display:none;z-index:50}.dr.on{display:block}.dri{position:absolute;top:0;bottom:0;left:0;width:min(460px,100%);background:#fff;padding:18px;overflow:auto;padding-top:calc(18px + env(safe-area-inset-top,0px))}
.x{float:left;border:0;background:#eef2f6;border-radius:8px;padding:5px 10px;cursor:pointer}.bk{border:0;background:none;color:var(--blue);cursor:pointer;padding:0 0 8px}
.lr{display:flex;gap:10px;align-items:center;padding:9px 4px;border-bottom:1px solid var(--ln);cursor:pointer}.lr div{flex:1}.lr small{display:block}.lr em{font-style:normal;font-size:12px}
.q5{display:grid;gap:8px;margin:12px 0}.q5 div{background:var(--p2);border-radius:8px;padding:9px 11px}.q5 small{display:block}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-size:12px}.kv span{color:var(--mu)}
.note{font-size:11px;color:var(--mu);margin-top:8px}
.big{font-size:15px;font-weight:700;line-height:1.7}
.badge-day{border-radius:10px;padding:2px 9px;font-size:11px;font-weight:700}
.today-list .lr:last-child{border-bottom:0}
.dq{background:#fff8e8;border:1px solid #f0dca0;border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:12px}
@media print{.top,#filters,.dr,.pbtn,#nav{display:none!important}.card{box-shadow:none;border:1px solid #ccc}body{background:#fff}}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(3,1fr)}.g2,.g3,.g2e{grid-template-columns:1fr}.wk{grid-template-columns:repeat(2,1fr)}}
@media(max-width:800px){.top{padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top,0px))}.wrap{padding:12px 12px 24px}#nav{padding-bottom:2px}#nav button{padding:7px 10px;font-size:12px}.kpis{grid-template-columns:1fr 1fr}.tl{left:-40px}.toolbar{width:100%;justify-content:space-between}.mg{grid-template-columns:1fr 1fr}}
</style>
</head>

const TT={priority:'ترکیبی از فوریت زمانی، اهمیت کالا (Criticality) و ریسک تأمین — عدد بالاتر یعنی این کالا زودتر باید بررسی شود.',demand:'امتیازی از میزان و ثبات مصرف روزانه؛ برای رتبه‌بندی اهمیت پیش‌بینی به‌کار می‌رود.',coverage:'نسبت موجودی فعلی به مصرف روزانه، به‌صورت امتیاز — پایین یعنی پوشش کم.',gap:'اگر منفی باشد یعنی زمان بهینه سفارش گذشته و سفارش باید آن تعداد روز پیش انجام می‌شد.',health:'ترکیب چهار امتیاز فرعی (کمبود، مازاد/راکد، تأخیر تأمین، خطای پیش‌بینی) در یک عدد ۰ تا ۱۰۰.',stockoutS:'ریسک تمام‌شدن موجودی — بالاتر یعنی خطر کمبود بیشتر.',excessS:'ریسک سرمایه قفل‌شده در موجودی مازاد یا راکد — بالاتر یعنی مازاد بیشتر.',delayS:'ریسک ناشی از تأخیر تحویل تأمین‌کننده این کالا.',forecastS:'میزان قابل‌اعتماد بودن پیش‌بینی تاریخ اتمام موجودی.',coverDays:'روزهایی که موجودی فعلی با نرخ مصرف فعلی دوام می‌آورد — مستقل از سفارش‌های در راه.',daysToOut:'تعداد روز تخمینی تا صفر شدن موجودی قابل‌استفاده، با احتساب روند مصرف.',turnover:'تعداد دفعاتی که موجودی این کالا در بازه محاسبه، گردش (فروش/مصرف و جایگزینی) داشته؛ پایین بودن آن یعنی سرمایه کند حرکت می‌کند.'};

/* ---------- داده ---------- */
function enrich(x){
  const av=N(x.AvailableStock),lead=N(x.AvgLeadTime),out=av<=0,days=out?0:N(x.DaysToStockout),gap=N(x.OrderTimingGap),rk=U(x.PreferredSupplierRiskLevel),hr=rk==='HIGH'||rk==='CRITICAL',q=N(x.SuggestedOrderQty);
  const st=U(x.StockStatus),ur=U(x.UrgencyLevel),ot=U(x.OrderTimingStatus),rec=U(x.OrderRecommendation),t=[],an=[],fd=pd(x.ForecastStockoutDate);
  if(ot==='ORDER NOW')t.push(['ORDER NOW','r']);
  if(st==='CRITICAL')t.push(['موجودی بحرانی','r']);
  if(st==='LOW')t.push(['LOW STOCK','o']);
  if(ur==='HIGH')t.push(['HIGH URGENCY','r']);
  if(hr)t.push([rk==='CRITICAL'?'ریسک بحرانی تأمین':'ریسک بالای تأمین','o']);
  if(gap<0)t.push(['فاصله زمانی منفی','r']);
  if(!out&&days<=CFG.fc)t.push(['کمبود تا '+fa(CFG.fc)+' روز','y']);
  let bad=false;
  if(N(x.TotalStock)<0){an.push('موجودی کل منفی');bad=true}else if(av<0){an.push('رزرو بیشتر از موجودی');bad=true}
  if(fd&&fd.getFullYear()<2000){an.push('تاریخ پیش‌بینی نامعتبر');bad=true}
  if(!x.PreferredSupplierCode&&(rec==='ORDER'||st==='CRITICAL')){an.push('کالای سفارشی بدون تأمین‌کننده ترجیحی');bad=true}
  const critW=({A:3,B:2,C:1})[U(x.Criticality)]||1;
  const p=(out||st==='CRITICAL'||days<=lead)?1:(ur==='HIGH'||rec==='ORDER'||ot==='ORDER NOW'||days<=lead+CFG.hz||st==='LOW')?2:t.length?3:4;
  const prob=out?'موجودی صفر یا منفی':days<=lead?'موجودی پیش از رسیدن سفارش تمام می‌شود':gap<0?'زمان سفارش گذشته است':rec==='ORDER'?'به نقطه سفارش رسیده':hr?'ریسک تأمین‌کننده بالا':days<=CFG.fc?'کمبود پیش‌بینی‌شده':'نیازمند پایش';
  const act=(bad?'ابتدا صحت داده را بررسی کنید؛ ':'')+(q>0?(p===1?'سفارش اضطراری ':'صدور سفارش ')+fa(q):hr?'پیگیری یا تأمین‌کننده جایگزین':'پایش');
  const rank=p*1000-critW*10-N(x.PriorityScore)/100;
  return {...x,_av:av,_lead:lead,_out:out,_days:days,_gap:gap,_rk:rk,_hr:hr,_t:t,_an:an,_bad:bad,_p:p,_prob:prob,_act:act,_rank:rank,_dead:T(x.DeadStockFlag),_slow:T(x.SlowMovingFlag),_sr:SI[x.PreferredSupplierCode+'|'+x.ItemCode]||null,_sn:SN[x.PreferredSupplierCode]||''};
}
function prep(d){
  SUPS=(d.suppliers||d.SUPS||[]).map(s=>({...s,SupplierRiskLevel:U(s.SupplierRiskLevel)}));
  SN={};SI={};SUPS.forEach(s=>{if(s.SupplierCode&&s.SupplierName)SN[s.SupplierCode]=s.SupplierName;SI[s.SupplierCode+'|'+s.ItemCode]=s});
  const vals=d.values||d.VALS||[];HASVAL=vals.length>0;
  const VM={};vals.forEach(v=>VM[v.ItemCode]=v);
  RAW=(d.items||d.ITEMS||[]).map(x=>({...VM[x.ItemCode],...x}));
  GEN=pd(d.generated||d.generatedAt||d.GeneratedAt||d.updated);
  ALL=RAW.map(enrich);
}
const isGood=x=>U(x.InventoryHealthStatus)==='HEALTHY'&&U(x.StockStatus)==='GOOD';
const acts=r=>r.filter(x=>x._p<=3).sort((a,b)=>a._rank-b._rank||a._days-b._days);
const match=x=>FD.every(([k,,f])=>!F[k]||String(x[f]||'-')===F[k]);
const fActive=()=>Object.values(F).some(Boolean);
async function load(){
  let d=null;SRC='embedded';let lastErr='';
  const urls=(typeof DATA_URLS!=='undefined'?DATA_URLS:[typeof DATA_URL!=='undefined'?DATA_URL:'data/dashboard.json']).flat();
  for(const u of urls){
    try{
      const r=await fetch(u+(u.includes('?')?'&':'?')+'t='+Date.now(),{cache:'no-store'});
      if(r.ok){d=await r.json();SRC='live';window.__DATA_URL=u;break}
      lastErr=u+' → HTTP '+r.status;
    }catch(e){lastErr=u+' → '+((e&&e.message)||e)}
  }
  if(!d){console.warn('PIDS data load failed:',lastErr);window.__DATA_ERR=lastErr}
  prep(d||{items:ITEMS0,suppliers:SUPS0,values:VALS0});
  const key=GEN?String(+GEN):'embedded';let s=null;try{s=JSON.parse(localStorage.getItem('snap'))}catch(e){}
  const cur=KPS(ALL).map(k=>k.n);
  if(s&&s.g!==key){PREV=s.v;PREVT=s.t||0}else if(s){PREV=s.pv;PREVT=s.pt||0}
  try{localStorage.setItem('snap',JSON.stringify({g:key,v:cur,t:Date.now(),pv:PREV,pt:PREVT}))}catch(e){}
  render();
}

const pn=(t,h,b,tk)=>`<section class="card pn"><div class="ph"><h2>${t}${hint(tk)}</h2><span class="mu">${h||''}</span></div>${b}</section>`;

const dist=(rows,key,fk,cm,lf)=>{const m={};rows.forEach(x=>{const v=String(x[key]||'-');m[v]=(m[v]||0)+1});return bars(Object.entries(m).sort((a,b)=>b[1]-a[1]).map(([v,n])=>({l:lf(v),v:n,c:cm[U(v)]||C.gry,on:`setF('${fk}','${v}')`})),rows.length)};

function table(id,cols,rows,lim,oc){
  const s=TS[id]||(TS[id]={k:null,d:1,all:false});let r=[...rows];
  if(s.k!=null){const c=cols[s.k];r.sort((a,b)=>{const A=c.s(a),B=c.s(b);return(A>B?1:A<B?-1:0)*s.d})}

const srt=(id,i)=>{const s=TS[id];s.d=s.k===i?-s.d:1;s.k=i;render()},tall=id=>{TS[id].all=!TS[id].all;render()};

/* ---------- KPI ---------- */
function KPS(r){
  const val=r.reduce((a,x)=>a+N(x.InventoryValue),0),av=r.reduce((a,x)=>a+x._av,0),neg=r.filter(x=>x._av<0).length;
  const sup=new Set(r.filter(x=>x._hr&&x.PreferredSupplierCode).map(x=>x.PreferredSupplierCode)),good=r.filter(isGood),bad=r.filter(x=>!isGood(x));
  return [
    {l:'کل کالاها',n:r.length,rows:r,s:'اقلام در محدوده فیلتر'},
    {l:'اقلام بحرانی',n:r.filter(x=>x._p===1).length,rows:r.filter(x=>x._p===1),c:'red',bad:1,s:'اولویت ۱ لیست اقدامات'},
    {l:'نیازمند سفارش',n:r.filter(x=>U(x.OrderRecommendation)==='ORDER').length,rows:r.filter(x=>U(x.OrderRecommendation)==='ORDER'),c:'org',bad:1,s:'OrderRecommendation = ORDER'},
    {l:'ارزش موجودی',n:val,txt:HASVAL?money(val):'—',rows:HASVAL?[...r].sort((a,b)=>N(b.InventoryValue)-N(a.InventoryValue)):[],c:'gold',s:HASVAL?'واحد: '+CUR_UNIT():'فیلد InventoryValue در JSON نیست'},
    {l:'موجودی قابل استفاده',n:av,txt:fa(av),rows:[...r].sort((a,b)=>a._av-b._av),c:'grn',s:neg?`${fa(neg)} قلم منفی — بررسی شود`:'مجموع واحدها'},
    {l:'کالاهای راکد',n:r.filter(x=>x._dead).length,rows:r.filter(x=>x._dead),c:'yel',bad:1,s:'Dead Stock'},
    {l:'کالاهای کم‌گردش',n:r.filter(x=>x._slow).length,rows:r.filter(x=>x._slow),c:'yel',bad:1,s:'Slow Moving'},
    {l:'کالاهای سالم',n:good.length,rows:good,c:'grn',bad:0,s:`${fa(r.length?good.length/r.length*100:0)}٪ از کل`},
    {l:'کالاهای ناسالم',n:bad.length,rows:bad,c:'red',bad:1,s:'هر قلم غیر از «سالم و مناسب»'},
    {l:'تأمین‌کنندگان پرریسک',n:sup.size,rows:r.filter(x=>x._hr),c:'red',bad:1,s:'ترجیحی با ریسک بالا/بحرانی'}];
}
function kpiRow(K,pv){KR=K.map(k=>[k.l,k.rows]);return `<section class="kpis">${K.map((k,i)=>{const idx=K._idx?K._idx[i]:i,d=pv&&pv[idx]!=null?k.n-pv[idx]:0,cl=!d||k.bad==null?'':((d>0)===!!k.bad?'r':'g');return `<div class="card kpi ${k.c||''}" onclick="drillK(${i})"><div class="l">${k.l}</div><div class="v">${k.txt??fa(k.n)}${d?`<em class="dl ${cl}">${d>0?'▲':'▼'} ${fa(Math.abs(d),1)}</em>`:''}</div><div class="s">${k.s}</div></section>`.replace('</section>','</div>')}).join('')}</section>`}
const kpiH=r=>{const K=KPS(r);return kpiRow(K,!fActive()&&PREV)};

  ['به نقطه سفارش می‌رسند','🟡',r.filter(x=>!x._out&&x._av>N(x.ReorderPoint)&&x._av-H*N(x.AvgDailyDemand)<=N(x.ReorderPoint))],
  ['موجودی تمام می‌شود','🔴',r.filter(x=>x._out||x._days<=H)],
  ['سفارش دیر می‌رسد','🟠',r.filter(x=>x._gap<0)],
  ['پوشش موجودی پایین','🟠',r.filter(x=>!x._out&&N(x.CoverageDays)>0&&N(x.CoverageDays)<CFG.cover)],
  ['افزایش ریسک تأمین','🟠',r.filter(x=>x._hr&&x._days<=x._lead+2*H)]]}
const weekH=r=>{WR=weekR(r);return `<div class="wk">${WR.map(([t,ic,a],i)=>`<div class="wt" onclick="drillW(${i})"><div>${ic} ${t}</div><strong>${fa(a.length)}</strong><small>${[...a].sort((p,q)=>p._days-q._days).slice(0,3).map(x=>x.ItemName).join('، ')||'موردی نیست'}</small></div>`).join('')}</div>`};
function alertsH(r){
  const pr=x=>x._sr&&N(x._sr.DelayRate)>CFG.rate;
  const A=[['r','کالای راکد (Dead Stock)','سرمایه بدون گردش',r.filter(x=>x._dead)],['y','کالای کم‌گردش (Slow Moving)','مصرف بسیار پایین',r.filter(x=>x._slow)],
   ['o','تأمین‌کننده پرریسک','ترجیحی با ریسک بالا/بحرانی',r.filter(x=>x._hr)],['o','Lead Time طولانی','بیش از '+fa(CFG.lead)+' روز',r.filter(x=>x._lead>CFG.lead)],
   ['r','Coverage کمتر از Lead Time','پوشش تا رسیدن سفارش کافی نیست',r.filter(x=>!x._out&&N(x.CoverageDays)<x._lead)],['o','DelayRate بالا','بیش از '+fa(CFG.rate*100)+'٪ تحویل با تأخیر',r.filter(pr)],
   ['r','داده‌های غیرعادی','موجودی منفی، تاریخ نامعتبر، نبود تأمین‌کننده',r.filter(x=>x._an.length)]].filter(a=>a[3].length);

}
function gauge(r){const n=r.length||1,sc=Math.round(r.filter(isGood).length/n*100),c=sc>=85?C.grn:sc>=65?C.org:C.red,a='M10 60A50 50 0 0 1 110 60';
  return `<div class="gg"><svg viewBox="0 0 120 70"><path d="${a}" fill="none" stroke="#e6ebf0" stroke-width="12" stroke-linecap="round"/><path d="${a}" fill="none" stroke="${c}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${157.1*sc/100} 157.1"/></svg><div class="gv" style="color:${c}">${fa(sc)}٪<small>کالای سالم</small></div><div class="tl">${[C.red,C.org,C.grn].map(k=>`<i style="background:${k};opacity:${k===c?1:.2}"></i>`).join('')}</div></div>`}

/* ---------- صفحه‌ها ---------- */
function todayV(r){
  const A=acts(r),p1=A.filter(x=>x._p===1).length,now=r.filter(x=>U(x.OrderTimingStatus)==='ORDER NOW');
  const tone=p1?'r':A.length?'o':'g';
  const ban=`<div class="ban ${tone}"><b class="big">${p1?'🔴 '+fa(p1)+' قلم بحرانی — '+fa(now.length)+' سفارش باید همین امروز صادر شود':A.length?'🟠 '+fa(A.length)+' قلم نیازمند توجه است':'🟢 وضعیت موجودی پایدار است'}</b></div>`;
  const K=KPS(r),curV=K.map(k=>k.n);

   `<div class="g2e">${pn('منبع داده','',`<div class="kv"><span>حالت</span><b>${SRC==='live'?'زنده (JSON)':'داده نمونه داخلی'}</b><span>آدرس JSON</span><b dir="ltr">${window.__DATA_URL||(typeof DATA_URLS!=='undefined'?DATA_URLS[0]:'data/dashboard.json')}</b><span>خطای بارگذاری</span><b>${window.__DATA_ERR||(SRC==='live'?'—':('fetch ناموفق — '+(window.__DATA_ERR||'404 یا مسیر اشتباه')))}</b><span>آخرین به‌روزرسانی</span><b>${GEN?dt(GEN)+' '+tf.format(GEN):'نامشخص'}</b><span>تعداد کالا / ردیف تأمین</span><b>${fa(RAW.length)} / ${fa(SUPS.length)}</b><span>جدول ارزش/سلامت</span><b>${HASVAL?'✅ موجود':'➖ در JSON نیست'}</b></div><div class="note">ساختار JSON: {"generated":"ISO date","items":[…tblengine],"suppliers":[…tblSupplierEngine],"values":[…جدول ارزش/سلامت]}</div>`)}${pn('پوشش فیلدها','فیلدهایی که در صورت وجود، ویجت‌های مرتبط را فعال می‌کنند',`<div class="kv">${EXP.map(k=>`<span>${k}</span><b>${RAW.some(x=>x[k]!=null)?'✅ موجود':'➖ در JSON نیست'}</b>`).join('')}</div>`)}</div>`;
}
const V={today:todayV,cmd:cmdV,act:actV,health:healthV,order:ordV,sup:supV,fin:finV,item:itemV,set:setV};

/* ---------- کشوی جزئیات ---------- */
function dr(h,keep){if(!keep)stack=[];else if(cur)stack.push(cur);cur=h;$('drb').innerHTML=(stack.length?'<button class="bk" onclick="drBack()">→ بازگشت</button>':'')+h;$('dr').classList.add('on')}
let cur='';const drBack=()=>{cur=stack.pop();$('drb').innerHTML=(stack.length?'<button class="bk" onclick="drBack()">→ بازگشت</button>':'')+cur},closeDr=()=>{$('dr').classList.remove('on');stack=[];cur=''};
const lrow=(x,k)=>`<div class="lr" onclick="openItem('${x.ItemCode}',1)"><span>${PI[x._p]}</span><div><b>${x.ItemName}</b><small>${x.ItemCode} · ${x._prob}</small></div><em>${x._out?'تمام‌شده':x._days>999?'>۹۹۹ روز':fa(x._days)+' روز'}</em></div>`;
function openList(t,rows){dr(`<h2>${t} <small>(${fa(rows.length)})</small></h2>`+(rows.slice(0,80).map(lrow).join('')||'<div class="em">موردی نیست</div>')+(rows.length>80?'<div class="note">۸۰ مورد اول نمایش داده شد.</div>':''))}
const drillK=i=>openList(KR[i][0],KR[i][1]),drillW=i=>openList(WR[i][0],[...WR[i][1]].sort((a,b)=>a._days-b._days));
function openItem(c,keep){
  const x=ALL.find(z=>z.ItemCode===c);if(!x)return;const A=acts(ALL),rk=A.indexOf(x)+1,s=x._sr,margin=x._days-x._lead;
  dr(`<h2>${PI[x._p]} ${x.ItemName}</h2><small>${x.ItemCode} · ${x.CategoryCode||''} / ${x.SubCategoryCode||''} · اهمیت ${x.Criticality||'—'}</small>`+
  `<div class="q5"><div><small>چه مشکلی؟</small><b>${x._prob}</b><br>${chips(x)}</div><div><small>چقدر جدی؟</small><b>${PN[x._p]}</b></div><div><small>چه کنم؟</small><b>${x._act}</b></div><div><small>چقدر وقت دارم؟</small><b>${x._out?'موجودی تمام شده':fa(x._days)+' روز تا اتمام · Lead Time '+fa(x._lead,1)+' روز'}</b>${x._out?'':`<br><small>${margin<0?'⚠ '+fa(-margin)+' روز کمتر از زمان تأمین':'حاشیه امن '+fa(margin)+' روز'}</small>`}</div><div><small>اول کدام؟</small><b>${rk?'رتبه '+fa(rk)+' از '+fa(A.length)+' در لیست اقدامات':'در لیست اقدامات نیست'}</b></div></div>`+
  (x._an.length?`<div class="ban r"><span>⚠ ${x._an.join(' · ')}</span></div>`:'')+
  `<div class="kv"><span>موجودی کل</span><b>${fa(x.TotalStock)}</b><span>قابل استفاده</span><b>${fa(x._av)}</b><span>رزرو</span><b>${fa(x.ReservedStock)}</b><span>نقطه سفارش</span><b>${fa(x.ReorderPoint)}</b><span>مصرف روزانه</span><b>${fa(x.AvgDailyDemand,1)}</b><span>مقدار سفارش پیشنهادی</span><b>${fa(x.SuggestedOrderQty)}</b><span>تاریخ اتمام</span><b>${x._out?'—':dt(x.ForecastStockoutDate)}</b><span>روز بهینه سفارش</span><b>${dt(x.OptimalOrderDay)}</b><span>تأمین‌کننده</span><b>${x._sn||'—'}</b><span>ریسک تأمین</span><b>${x._rk?lb(x._rk):'—'}</b>${s?`<span>DelayRate</span><b>${fa(N(s.DelayRate)*100)}٪</b><span>میانگین تأخیر</span><b>${fa(s.AvgDelayDays,1)} روز</b>`:''}${HASVAL&&x.InventoryValue!=null?`<span>ارزش موجودی</span><b>${money(x.InventoryValue)}</b>`:''}${HASVAL&&x.HealthScore!=null?`<span>HealthScore</span><b title="${TT.health}">${fa(x.HealthScore,1)}</b>`:''}</div>`,keep);
}
function openSup(c){const a=SUPS.filter(s=>s.SupplierCode===c).map(s=>s.ItemCode),rows=ALL.filter(x=>a.includes(x.ItemCode));openList(SN[c]||c,rows)}

/* ---------- کنترل ---------- */
function setF(k,v){F[k]=F[k]===v?'':v;if(k==='cat')F.sub='';render()}
function resetF(){Object.keys(F).forEach(k=>F[k]='');render()}
const go=v=>{CUR=v;location.hash=v;render();scrollTo(0,0)};
function setMode(m){MODE=m;try{localStorage.setItem('mode',m)}catch(e){}render()}
function saveCfg(){CF.forEach(([k])=>{const v=parseFloat($('c_'+k).value);if(isFinite(v))CFG[k]=v});try{localStorage.setItem('cfg',JSON.stringify(CFG))}catch(e){}try{localStorage.setItem('cur',$('c_cur').value)}catch(e){}ALL=RAW.map(enrich);render()}
const optL=(k,v)=>k==='sup'?(SN[v]||'بدون تأمین‌کننده'):k==='stock'||k==='health'?lb(v):k==='urg'?lu(v):v==='-'?'نامشخص':v;
function filtersH(r){
  const open=$('filters').open,has=ALL.some(x=>x.StorageLocation),n=Object.values(F).filter(Boolean).length;
  $('filters').innerHTML=`<summary>🔎 فیلترها ${n?`(${fa(n)} فعال)`:''} <span class="mu">— ${fa(r.length)} از ${fa(ALL.length)} قلم</span></summary><div class="fs">`+FD.filter(f=>f[0]!=='loc'||has).map(([k,l,f])=>{
    const vals=[...new Set(ALL.filter(x=>k!=='sub'||!F.cat||x.CategoryCode===F.cat).map(x=>String(x[f]||'-')))].sort();
    return `<label>${l}<select onchange="setF('${k}',this.value)"><option value="">همه</option>${vals.map(v=>`<option value="${v}"${F[k]===v?' selected':''}>${optL(k,v)}</option>`).join('')}</select></label>`}).join('')+`</div><button class="lnk" onclick="resetF()">پاک کردن فیلترها</button>`;
  $('filters').open=open;
}
function render(){
  const NAV=NAV_ALL.filter(n=>n[0]!=='fin'||MODE==='mg');
  if(!V[CUR]||(CUR==='fin'&&MODE!=='mg'))CUR='today';
  const r=ALL.filter(match);filtersH(r);$('view').innerHTML=V[CUR](r);
  $('nav').innerHTML=NAV.map(([k,l,i])=>`<button class="${k===CUR?'on':''}" onclick="go('${k}')"><i>${i}</i>${l}</button>`).join('');
  $('segOp').className=MODE==='op'?'on':'';$('segMg').className=MODE==='mg'?'on':'';
  const age=GEN?(Date.now()-GEN)/864e5:0;
  $('stamp').innerHTML='کنترل عملیات و سلامت موجودی'+(SRC==='live'?(age>2?'<span class="pill o">داده قدیمی</span>':'<span class="pill g">زنده</span>'):'<span class="pill n">داده نمونه</span>')+(GEN?` · ${dt(GEN)} ${tf.format(GEN)}`:'');
}
addEventListener('hashchange',()=>{CUR=location.hash.slice(1)||'today';render()});
$('filters').open=innerWidth>800;
load();
</script>
</body>
</html>
